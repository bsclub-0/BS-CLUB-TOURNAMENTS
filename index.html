<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club Tournament</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5fb;--cd:#fff;--tx:#1c1b22;--mu:#6b6980;--ac:#6d3df5;--bd:#e3e1ee;--ok:#12805c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131a;--cd:#1f1d29;--tx:#f0eef8;--mu:#a09cb8;--ac:#9b78ff;--bd:#333047;--ok:#4fd1a1}}
:root[data-theme="dark"]{--bg:#14131a;--cd:#1f1d29;--tx:#f0eef8;--mu:#a09cb8;--ac:#9b78ff;--bd:#333047;--ok:#4fd1a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bd);font-size:13px}.chip.on{background:var(--ok);color:#fff}
.m{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.m.me{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:8px;padding:8px}
.org{border:2px solid var(--ac)}
.bar{position:sticky;bottom:8px;display:none}.bar.s{display:block}
</style></head><body><div id="app"></div>
<script>
const DEF={name:'Club Tournament',prize:'Brawl Pass',start:'',ciTime:'',ciOpen:false,mode:'s',players:[],teams:[],rounds:null,trounds:null,nid:1,seen:[]};
let S=JSON.parse(JSON.stringify(DEF)),isOrg=false,dirty=false,me=0,msg='';
function alert(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:12px;right:12px;bottom:70px;background:#222;color:#fff;padding:12px;border-radius:10px;z-index:99;text-align:center';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',5000)}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=v=>{try{return v?new Date(v).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'Not set yet'}catch(e){return v}};
const T=()=>S.mode=='t',L=()=>T()?S.teams:S.players,R=()=>T()?S.trounds:S.rounds,key=t=>String(t).replace('#','').toUpperCase();
const ent=id=>L().find(x=>x.id==id);
const nm=id=>{const p=ent(id);return p?esc(p.n)+(p.m&&p.m.length?'<div class="mu">'+p.m.map(x=>esc(x.n)).join(', ')+'</div>':' <span class="mu">'+esc(p.t)+'</span>'):'-'};
const hit=(p,k)=>key(p.t)==k||(p.m&&p.m.some(x=>key(x.t)==k));
function set(k,v){S[k]=v;if(k=='mode')me=0;dirty=true;if(k=='ciOpen')render();else bar()}
function bar(){const b=$('bar');if(b)b.classList.toggle('s',dirty)}
function add(l,n,t,m){n=String(n||'').trim();t=String(t||'').trim();if(!n||!t)return;const k=key(t),p=l.find(x=>key(x.t)==k);if(p){p.n=n;if(m)p.m=m;return}l.push({id:S.nid++,n,t:t.startsWith('#')?t:'#'+t,c:false,m:m||null})}
function pm(s){return String(s||'').split(';').slice(0,3).map(x=>{const a=x.split('|');return{n:(a[0]||'').slice(0,30),t:(a[1]||'').slice(0,15)}})}
function chk(tag){const k=key(tag);[S.players,S.teams].forEach(l=>l.forEach(p=>{if(hit(p,k))p.c=true}))}
function imp(){$('paste').value.split('\n').forEach(l=>{l=l.trim();if(!l)return;const a=l.split('|').map(x=>x.trim()),u=(a[0]||'').toUpperCase();if(u=='JOIN')add(S.players,a[1],a[2]);else if(u=='TEAM'&&a.length>=8)add(S.teams,a[1],a[3],[2,4,6].map(i=>({n:a[i],t:a[i+1]})));else if(u=='CHECKIN')chk(a[1]||'');else if(a.length>1)add(S.players,a[0],a[1]);else{const i=l.lastIndexOf('#');if(i>0)add(S.players,l.slice(0,i),l.slice(i))}});dirty=true;render()}
function tog(id){const p=ent(id);p.c=!p.c;dirty=true;render()}
function del(id){if(R())return alert('Reset the bracket first.');if(T())S.teams=S.teams.filter(x=>x.id!=id);else S.players=S.players.filter(x=>x.id!=id);dirty=true;render()}
function mk(){const a=L().filter(p=>!S.ciOpen||p.c).map(p=>p.id);if(a.length<2)return alert('Need at least 2 '+(T()?'teams':'players')+(S.ciOpen?' checked in':''));if(a.length%2)a.push(0);const n=a.length,r=[];for(let i=0;i<n-1;i++){const m=[];for(let j=0;j<n/2;j++){const x=a[j],y=a[n-1-j];if(x&&y)m.push([x,y,0])}r.push(m);a.splice(1,0,a.pop())}if(T())S.trounds=r;else S.rounds=r;dirty=true;render();window.scrollTo(0,0);alert('Bracket ready! Tap Publish changes so members can see it.')}
function rst(){if(T())S.trounds=null;else S.rounds=null;dirty=true;render();alert('Bracket reset. Tap Publish changes.')}
function res(r,i,w){R()[r][i][2]=+w;dirty=true;render()}
function stand(){const rs=R(),w={},ids=new Set();L().forEach(p=>w[p.id]=0);let tot=0,done=0;rs.forEach(x=>x.forEach(m=>{tot++;ids.add(m[0]);ids.add(m[1]);if(m[2]){done++;w[m[2]==1?m[0]:m[1]]++}}));return{L:[...ids].map(id=>[id,w[id]||0]).sort((a,b)=>b[1]-a[1]),tot,done}}
const FB='https://bs-club-tournament-default-rtdb.firebaseio.com/entries';
async function code(kind){let n='',t='',m='';
if(kind=='CHECKIN'){t=($('ct')?.value||'').trim();if(!t)return alert('Enter your game tag')}
else if(T()){n=($('tn')?.value||'').trim();const v=[1,2,3].map(i=>[($('pn'+i)?.value||'').trim().slice(0,30),($('pt'+i)?.value||'').trim().slice(0,15)]);if(!n||v.some(x=>!x[0]||!x[1]))return alert('Enter the team name and all 3 players (name and tag)');t=v[0][1];m=v.map(x=>x.join('|')).join(';')}
else{n=($('gn')?.value||'').trim();t=($('gt')?.value||'').trim();if(!n||!t)return alert('Enter your game name and tag')}
const body={type:kind=='CHECKIN'?'checkin':T()?'team':'join',n:n.slice(0,30),t:t.slice(0,15),ts:Date.now()};if(m)body.m=m;
try{const r=await fetch(FB+'.json',{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw 0;msg=kind=='CHECKIN'?'✅ Check-in sent!':'✅ Sent! The organizer will add '+(T()?'your team':'you')+' to the list.'}catch(e){msg='⚠️ Could not send. Try again.'}render()}
async function pull(){let ch=0;try{const r=await fetch(FB+'.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();if(!d)return 0;Object.keys(d).sort().forEach(id=>{if(S.seen.includes(id))return;const e=d[id];let ok=false;if(e.type=='join'){add(S.players,e.n,e.t);ok=true}else if(e.type=='team'){add(S.teams,e.n,e.t,pm(e.m));ok=true}else{const k=key(e.t);[S.players,S.teams].forEach(l=>l.forEach(p=>{if(hit(p,k)){p.c=true;ok=true}}))}if(ok){S.seen.push(id);ch++}});if(ch)dirty=true}catch(e){}return ch}
async function load(){const o=location.hostname.split('.')[0],r=location.pathname.split('/')[1]||(o+'.github.io');let tk='';try{tk=localStorage.getItem('tk')||''}catch(e){}const H={Accept:'application/vnd.github.raw+json'};if(tk)H.Authorization='Bearer '+tk;const fin=async x=>{S=Object.assign(JSON.parse(JSON.stringify(DEF)),await x.json())};try{const x=await fetch('https://api.github.com/repos/'+o+'/'+r+'/contents/data.json?t='+Date.now(),{headers:H,cache:'no-store'});if(x.ok){await fin(x);return}}catch(e){}try{const x=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(x.ok)await fin(x)}catch(e){}}
async function refresh(){if(dirty)return alert('You have unpublished changes. Publish first.');await load();if(isOrg)await pull();render();alert('Updated')}
async function pub(){const tk=localStorage.getItem('tk');if(!tk)return alert('Log in as organizer first');const o=location.hostname.split('.')[0],r=location.pathname.split('/')[1]||(o+'.github.io'),u='https://api.github.com/repos/'+o+'/'+r+'/contents/data.json',H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};try{let sha;const g=await fetch(u,{headers:H});if(g.ok)sha=(await g.json()).sha;const b=btoa(unescape(encodeURIComponent(JSON.stringify(S,null,1))));const p=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:'Update tournament',content:b,sha})});if(!p.ok)throw new Error(p.status==401||p.status==403||p.status==404?'Token has no write access to this repo':'Error '+p.status);dirty=false;bar();alert('Published! Members see it in a few seconds.')}catch(e){alert(e.message)}}
function login(){const t=prompt('Paste your GitHub token');if(t){localStorage.setItem('tk',t.trim());isOrg=true;render()}}
function logout(){localStorage.removeItem('tk');isOrg=false;render()}
function render(){
const t=T(),l=L(),rs=R();
let h=`<div class="c"><h1>🏆 ${esc(S.name)}</h1><div class="mu">Club members only · Round robin · One winner · <b>${t?'Team 3v3':'Solo 1v1'}</b></div><p style="margin:10px 0 0">🎁 Prize: <b>${esc(S.prize)}</b><br>📅 Starts: <b>${fd(S.start)}</b><br>✅ Check-in time: <b>${fd(S.ciTime)}</b> <span class="chip ${S.ciOpen?'on':''}">${S.ciOpen?'Check-in OPEN':'Check-in not open yet'}</span></p></div>`;
if(isOrg){h+=`<div class="c org"><h2>👑 Organizer panel</h2>
<label class="mu">Tournament name</label><input value="${esc(S.name)}" oninput="set('name',this.value)">
<label class="mu">Mode (you can switch any time)</label><select onchange="set('mode',this.value);render()"><option value="s"${t?'':' selected'}>Solo 1v1</option><option value="t"${t?' selected':''}>Team 3v3</option></select>
<label class="mu">Prize</label><select onchange="set('prize',this.value)"><option${S.prize=='Brawl Pass'?' selected':''}>Brawl Pass</option><option${S.prize=='Brawl Pass Plus'?' selected':''}>Brawl Pass Plus</option></select>
<label class="mu">Tournament date &amp; time</label><input type="datetime-local" value="${esc(S.start)}" oninput="set('start',this.value)">
<label class="mu">Check-in time</label><input type="datetime-local" value="${esc(S.ciTime)}" oninput="set('ciTime',this.value)">
<label class="row" style="gap:8px"><input type="checkbox" style="width:auto;flex:0" ${S.ciOpen?'checked':''} onchange="set('ciOpen',this.checked)"> Show check-in option to members (only checked-in ${t?'teams':'players'} get in the bracket)</label>
<h2 style="margin-top:12px">Add manually</h2><div class="mu">One per line: <i>Name | #TAG</i>, <i>CHECKIN | #TAG</i>, or <i>TEAM | Team | N1 | #T1 | N2 | #T2 | N3 | #T3</i>. Member sign-ups arrive by themselves.</div><textarea id="paste" rows="3"></textarea><button onclick="imp()">Add / update</button>
<div class="mu" style="margin-top:12px">Other organizers: add them as collaborators on your GitHub repo, then they log in with their own token.</div><button class="g" style="margin-top:8px" onclick="logout()">Log out</button></div>`}
h+=`<div class="c"><h2>${t?'Teams':'Players'} (${l.length})</h2>`;
if(!l.length)h+='<div class="mu">None yet.</div>';
l.forEach(p=>{h+=`<div class="m"><span>${nm(p.id)}</span><span>${S.ciOpen||isOrg?`<span class="chip ${p.c?'on':''}" ${isOrg?`onclick="tog(${p.id})" style="cursor:pointer"`:''}>${p.c?'checked in':'not checked in'}</span> `:''}${isOrg&&!rs?`<span onclick="del(${p.id})" style="cursor:pointer">✕</span>`:''}</span></div>`});
h+='</div>';
if(!rs){
h+=`<div class="c"><h2>${t?'Register your team (3 players)':'Join the tournament'}</h2>`+(t?`<input id="tn" placeholder="Team name">`+[1,2,3].map(i=>`<div class="row"><input id="pn${i}" placeholder="Player ${i} name${i==1?' (captain)':''}"><input id="pt${i}" placeholder="Tag #ABC123"></div>`).join(''):`<input id="gn" placeholder="Your game name"><input id="gt" placeholder="Your game tag (#ABC123)">`)+`<button onclick="code('JOIN')">Participate</button></div>`;
if(S.ciOpen)h+=`<div class="c"><h2>Check in</h2><input id="ct" placeholder="${t?'Any of your team’s tags':'Your game tag'} (#ABC123)"><button onclick="code('CHECKIN')">Check in</button></div>`;
if(msg)h+=`<p><b>${esc(msg)}</b></p>`;
if(isOrg)h+=`<div class="c org"><button onclick="mk()">⚡ Make bracket (one click)</button></div>`}
else{const s=stand();
h+=`<div class="c"><h2>Find my opponents</h2><select onchange="me=this.value;render()"><option value="0">Show everyone</option>${l.map(p=>`<option value="${p.id}"${me==p.id?' selected':''}>${esc(p.n)}</option>`).join('')}</select></div>`;
rs.forEach((Rd,r)=>{h+=`<div class="c"><h2>Round ${r+1}</h2>`;Rd.forEach((m,i)=>{const mine=me&&(m[0]==me||m[1]==me);if(me&&!mine)return;const A=ent(m[0]),B=ent(m[1]);h+=`<div class="m${mine?' me':''}"><span>${m[2]==1?'🏅 ':''}${nm(m[0])}</span><span class="mu">vs</span><span style="text-align:right">${m[2]==2?'🏅 ':''}${nm(m[1])}</span></div>`+(isOrg&&A&&B?`<select onchange="res(${r},${i},this.value)"><option value="0">Result…</option><option value="1"${m[2]==1?' selected':''}>Winner: ${esc(A.n)}</option><option value="2"${m[2]==2?' selected':''}>Winner: ${esc(B.n)}</option></select>`:'')});h+='</div>'});
h+=`<div class="c"><h2>Standings (${s.done}/${s.tot} matches)</h2>`;s.L.forEach(([id,w],i)=>{h+=`<div class="m"><span>${i+1}. ${nm(id)}</span><b>${w} W</b></div>`});
if(s.done==s.tot&&s.L.length)h+=s.L[1]&&s.L[1][1]==s.L[0][1]?'<p><b>Tie for first — tie-break match needed.</b></p>':`<p>🎉 <b>Winner: ${nm(s.L[0][0])}</b> wins ${esc(S.prize)}!</p>`;
h+='</div>';
if(isOrg)h+=`<div class="c org"><button class="g" onclick="rst()">Reset bracket</button></div>`}
if(isOrg)h+=`<div class="bar" id="bar"><button style="width:100%" onclick="pub()">Publish changes so members see them</button></div>`;
h+=`<p class="mu" style="text-align:center"><a href="#" onclick="refresh();return false">↻ Refresh</a>${isOrg?'':' · <a href="#" onclick="login();return false">Organizer login</a>'}</p>`;
$('app').innerHTML=h;bar()}
render();
(async()=>{try{isOrg=!!localStorage.getItem('tk')}catch(e){}await load();if(isOrg)await pull();render();setInterval(async()=>{if(isOrg&&document.activeElement.tagName!='INPUT'&&await pull())render()},20000)})();
</script></body></html>
